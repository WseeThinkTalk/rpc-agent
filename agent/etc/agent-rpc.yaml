  Mode: console
  Level: info

# 渚濊禆鐨?RPC 鏈嶅姟
ArticleRpc:
  Endpoints:
    - 127.0.0.1:9090
  NonBlock: true
  Timeout: 10000
UserRpc:
  Endpoints:
    - 127.0.0.1:8080
  NonBlock: true
  Timeout: 10000
TagRpc:
  Endpoints:
    - 127.0.0.1:8084
  NonBlock: true
  Timeout: 10000
LikeRpc:
  Endpoints:
    - 127.0.0.1:8082
  NonBlock: true
  Timeout: 10000
FollowRpc:
  Endpoints:
    - 127.0.0.1:8081
  NonBlock: true
  Timeout: 10000
ReplyRpc:
  Endpoints:
    - 127.0.0.1:8083
  NonBlock: true
  Timeout: 10000

SessionRedis:
  Host: ${REDIS_HOST}:${REDIS_PORT}
  Pass: ${REDIS_PASS}
  Type: node
  DB: 1

