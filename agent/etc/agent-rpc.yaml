Name: agent.rpc
ListenOn: 0.0.0.0:8092

# Eino 妯″瀷閰嶇疆 (DeepSeek OpenAI 鍏煎鎺ュ彛)
Model:
  Provider: openai
  Model: deepseek-chat
  APIKey: ${LLM_API_KEY}
  BaseURL: ${LLM_BASE_URL}

# 宸ュ叿璋冪敤瓒呮椂 (ms)
ToolTimeout: 10000

# 浼氳瘽 TTL (绉?
SessionTTL: 604800

# 鏃ュ織
