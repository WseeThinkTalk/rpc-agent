Name: agent.rpc
ListenOn: 0.0.0.0:8087
Timeout: 120000
Etcd:
  Hosts:
    - ${ETCD_HOST}:${ETCD_PORT}
  Key: agent.rpc

# Agent LLM Model Configuration
Model:
  Provider: openai
  Model: deepseek-chat
  APIKey: ${LLM_API_KEY}
  BaseURL: ${LLM_BASE_URL}

ToolTimeout: 10000
SessionTTL: 604800

ArticleRpc:
  Endpoints:
    - 127.0.0.1:9090
  NonBlock: true
  Timeout: 10000

UserRpc:
  Endpoints:
    - 127.0.0.1:8080
  NonBlock: true
  Timeout: 10000

TagRpc:
  Endpoints:
    - 127.0.0.1:9090
  NonBlock: true
  Timeout: 10000

LikeRpc:
  Endpoints:
    - 127.0.0.1:8082
  NonBlock: true
  Timeout: 10000

FollowRpc:
  Endpoints:
    - 127.0.0.1:8080
  NonBlock: true
  Timeout: 10000

ReplyRpc:
  Endpoints:
    - 127.0.0.1:8082
  NonBlock: true
  Timeout: 10000

SessionRedis:
  Host: ${REDIS_HOST}:${REDIS_PORT}
  Pass: ${REDIS_PASS}
  Type: node
  DB: 1

DataSource: host=${DB_HOST} port=${DB_PORT} user=${DB_USER} password=${DB_PASS} dbname=Ask sslmode=disable

Embedding:
  APIKey: ${EMBEDDING_API_KEY}
  Model: BAAI/bge-large-zh-v1.5
  BaseURL: https://api.siliconflow.cn/v1
